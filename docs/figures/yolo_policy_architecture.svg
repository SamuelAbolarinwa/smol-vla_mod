<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc"><title id="title">Language-conditioned YOLO manipulation policy</title><desc id="desc">Implemented RGB baseline. Two cameras feed YOLO-World backbone and text-conditioned neck. Frozen CLIP instruction embeddings condition the neck and form a fusion token. Ninety-six visual tokens, one instruction token and one robot-state token enter two transformer encoder layers. A custom flow-matching action expert cross-attends to these features and generates sixteen seven-dimensional actions. The first action is executed and observations are refreshed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526174"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3d8563"/></marker></defs><rect width="1800" height="1040" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#233247">
<text x="48" y="54" font-size="34" font-weight="700" text-anchor="start" fill="#233247">Language-conditioned YOLO manipulation policy</text>
<text x="48" y="91" font-size="20" font-weight="400" text-anchor="start" fill="#64748b">Implemented RGB baseline  •  MLC Robotics Focus Group  •  Architecture v2</text>
<text x="160" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#64748b">INPUTS</text>
<text x="490" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#64748b">PRETRAINED ENCODERS</text>
<text x="860" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#64748b">TOKEN CONSTRUCTION</text>
<text x="1220" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#64748b">CONTEXT FUSION</text>
<text x="1580" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#64748b">ACTION GENERATION</text>
<rect x="40" y="205" width="240" height="135" rx="16" fill="#f1f5f9" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="160.0" y="238" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Two RGB cameras</text>
<text x="160.0" y="270" font-size="14.574898785425102" font-weight="400" text-anchor="middle" fill="#233247">External view + wrist view</text>
<text x="160.0" y="296" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">256 × 256 per image</text>
<rect x="340" y="190" width="300" height="110" rx="16" fill="#dceafb" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="490.0" y="223" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">YOLO backbone</text>
<text x="490.0" y="255" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">YOLOv8s-Worldv2</text>
<text x="490.0" y="281" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Shared across both cameras</text>
<rect x="340" y="340" width="300" height="135" rx="16" fill="#dceafb" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="490.0" y="373" font-size="20.535714285714285" font-weight="700" text-anchor="middle" fill="#233247">Text-conditioned neck</text>
<text x="490.0" y="405" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Multi-scale dense features</text>
<text x="490.0" y="431" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">P3 / P4 / P5</text>
<text x="490.0" y="457" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Detection head removed</text>
<path d="M280 260 H340" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<path d="M490 300 V340" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="710" y="340" width="300" height="135" rx="16" fill="#e7effc" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="860.0" y="373" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Pool + project</text>
<text x="860.0" y="405" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">4 × 4 grid per scale</text>
<text x="860.0" y="431" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">2 cameras × 3 scales × 16</text>
<text x="860.0" y="457" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">96 visual tokens</text>
<path d="M640 407 H710" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="40" y="555" width="240" height="125" rx="16" fill="#e6f3e9" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="160.0" y="588" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Instruction</text>
<text x="160.0" y="620" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">“Pick up the soup</text>
<text x="160.0" y="646" font-size="15.157894736842108" font-weight="400" text-anchor="middle" fill="#233247">and put it in the basket”</text>
<rect x="340" y="555" width="300" height="125" rx="16" fill="#dff0e3" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="490.0" y="588" font-size="17.96875" font-weight="700" text-anchor="middle" fill="#233247">Frozen CLIP text encoder</text>
<text x="490.0" y="620" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Tokenised instruction → 512D</text>
<text x="490.0" y="646" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Embedding cached per task</text>
<rect x="710" y="555" width="300" height="125" rx="16" fill="#e6f3e9" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="860.0" y="588" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Text projection</text>
<text x="860.0" y="620" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">512 → 256 dimensions</text>
<text x="860.0" y="646" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">1 instruction token</text>
<path d="M280 615 H340" fill="none" stroke="#3d8563" stroke-width="2.4"  marker-end="url(#green)"/>
<path d="M640 615 H710" fill="none" stroke="#3d8563" stroke-width="2.4"  marker-end="url(#green)"/>
<path d="M660 615 V505 H570 V475" fill="none" stroke="#3d8563" stroke-width="2.4"  marker-end="url(#green)"/>
<text x="512" y="529" font-size="16" font-weight="400" text-anchor="middle" fill="#3d8563">Text guide for each camera</text>
<rect x="40" y="755" width="240" height="120" rx="16" fill="#fff2db" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="160.0" y="788" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Robot state</text>
<text x="160.0" y="820" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Position + orientation</text>
<text x="160.0" y="846" font-size="14.574898785425102" font-weight="400" text-anchor="middle" fill="#233247">+ gripper state (8 values)</text>
<rect x="710" y="755" width="300" height="120" rx="16" fill="#fff2db" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="860.0" y="788" font-size="20.535714285714285" font-weight="700" text-anchor="middle" fill="#233247">Normalise + state MLP</text>
<text x="860.0" y="820" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">8 → 256 dimensions</text>
<text x="860.0" y="846" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">1 state token</text>
<path d="M280 815 H710" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<text x="486" y="800" font-size="16" font-weight="400" text-anchor="middle" fill="#64748b">Training-set statistics</text>
<rect x="1080" y="260" width="280" height="410" rx="16" fill="#f4f2fa" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="1220" y="300" font-size="24" font-weight="700" text-anchor="middle" fill="#233247">Observation fusion</text>
<text x="1220" y="333" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">98 tokens × 256 dimensions</text>
<rect x="1100" y="365" width="240" height="100" rx="16" fill="#e5e0f3" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="1220.0" y="398" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Self-attention</text>
<text x="1220.0" y="430" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">+ feed-forward network</text>
<rect x="1100" y="485" width="240" height="100" rx="16" fill="#e5e0f3" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="1220.0" y="518" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Self-attention</text>
<text x="1220.0" y="550" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">+ feed-forward network</text>
<text x="1220" y="638" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Custom transformer encoder</text>
<path d="M1010 407 H1080" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<path d="M1010 615 H1045 V445 H1080" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<path d="M1010 815 H1060 V480 H1080" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<text x="860" y="282" font-size="16" font-weight="400" text-anchor="middle" fill="#64748b">+ position / camera / scale</text>
<text x="860" y="306" font-size="16" font-weight="400" text-anchor="middle" fill="#64748b">and modality embeddings</text>
<rect x="1420" y="180" width="320" height="90" rx="16" fill="#f2eff8" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="1580.0" y="213" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Noise + flow time</text>
<text x="1580.0" y="245" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">16 × 7 initial action values</text>
<path d="M1580 270 V315" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<rect x="1420" y="315" width="320" height="355" rx="16" fill="#fff4d9" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="1580" y="353" font-size="24" font-weight="700" text-anchor="middle" fill="#233247">Flow action expert</text>
<text x="1580" y="385" font-size="15" font-weight="400" text-anchor="middle" fill="#233247">Action + position + time embeddings</text>
<rect x="1440" y="412" width="280" height="135" rx="16" fill="#ffe5a1" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="1580.0" y="445" font-size="22" font-weight="700" text-anchor="middle" fill="#233247">Decoder block × 2</text>
<text x="1580.0" y="477" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Action self-attention</text>
<text x="1580.0" y="503" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Cross-attention to context</text>
<text x="1580.0" y="529" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Feed-forward network</text>
<text x="1580" y="585" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Linear output → action velocity</text>
<text x="1580" y="620" font-size="18" font-weight="700" text-anchor="middle" fill="#233247">10 flow integration steps</text>
<text x="1580" y="648" font-size="15" font-weight="400" text-anchor="middle" fill="#233247">Custom network, trained on demos</text>
<path d="M1360 480 H1440" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<text x="1390" y="461" font-size="14" font-weight="700" text-anchor="middle" fill="#233247">K, V</text>
<rect x="1420" y="715" width="320" height="155" rx="16" fill="#eee6f7" stroke="#9aa6b4" stroke-width="1.8"/>
<text x="1580.0" y="748" font-size="20.10869565217391" font-weight="700" text-anchor="middle" fill="#233247">Continuous action chunk</text>
<text x="1580.0" y="780" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">16 future actions × 7 values</text>
<text x="1580.0" y="806" font-size="17" font-weight="400" text-anchor="middle" fill="#233247">Undo action normalisation</text>
<text x="1580.0" y="832" font-size="14.42495126705653" font-weight="400" text-anchor="middle" fill="#233247">Bound commands; execute first action</text>
<path d="M1580 670 V715" fill="none" stroke="#526174" stroke-width="2.4"  marker-end="url(#arrow)"/>
<path d="M1580 870 V930 H18 V273 H40" fill="none" stroke="#526174" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M160 930 V875" fill="none" stroke="#526174" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="850" y="918" font-size="19" font-weight="700" text-anchor="middle" fill="#233247">Simulator / robot step → fresh camera images and robot state → replan</text>
<text x="48" y="982" font-size="18" font-weight="400" text-anchor="start" fill="#233247">Language enters twice: it conditions YOLO features and also supplies a token to the fusion transformer.</text>
<text x="48" y="1012" font-size="17" font-weight="400" text-anchor="start" fill="#64748b">Current scope: no generative LLM, no depth branch, no bounding-box interface. New fusion and action weights are learned from demonstrations.</text>
</g></svg>